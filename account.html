<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Account — Music Platform</title>
<style>
  :root {
    --bg: #f6f7f5;
    --surface: #ffffff;
    --surface-alt: #eef0ed;
    --border: #dfe2de;
    --ink: #14181c;
    --ink-muted: #5b6560;
    --accent: #1e6feb;
    --accent-ink: #ffffff;
    --lime: #65a30d;
    --teal: #60a5fa;
    --danger: #b3261e;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    position: relative;
    overflow-x: hidden;
  }

  /* --- Animated background --- */
  .bg-blobs { position: fixed; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; }
  .blob { position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.24; }
  .blob-1 { width: 300px; height: 300px; background: var(--accent); top: -100px; left: -80px; animation: float1 16s ease-in-out infinite; }
  .blob-2 { width: 260px; height: 260px; background: var(--lime); bottom: -90px; right: -60px; animation: float2 20s ease-in-out infinite; }
  .blob-3 { width: 200px; height: 200px; background: var(--teal); top: 46%; right: -80px; animation: float3 18s ease-in-out infinite; }
  @keyframes float1 { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(36px, 46px) scale(1.12); } }
  @keyframes float2 { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(-34px, -26px) scale(1.16); } }
  @keyframes float3 { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(-24px, 34px) scale(0.9); } }
  @media (prefers-reduced-motion: reduce) {
    .blob { animation: none !important; }
  }

  .wrap { position: relative; z-index: 1; max-width: 420px; margin: 0 auto; padding: 20px 16px 60px; }

  .eq { display: flex; align-items: flex-end; gap: 4px; height: 20px; margin-bottom: 10px; }
  .eq span { width: 4px; background: var(--accent); border-radius: 2px; transform-origin: bottom; animation: eq 1.1s ease-in-out infinite; }
  .eq span:nth-child(1) { height: 40%; animation-delay: 0s; }
  .eq span:nth-child(2) { height: 75%; animation-delay: 0.15s; }
  .eq span:nth-child(3) { height: 100%; animation-delay: 0.3s; }
  .eq span:nth-child(4) { height: 60%; animation-delay: 0.45s; }
  .eq span:nth-child(5) { height: 85%; animation-delay: 0.6s; }
  @keyframes eq { 0%, 100% { transform: scaleY(0.35); } 50% { transform: scaleY(1); } }
  @media (prefers-reduced-motion: reduce) {
    .eq span { animation: none; transform: scaleY(0.7); }
  }

  .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .header-left { display: flex; align-items: center; gap: 10px; }
  #back-link {
    width: 32px; height: 32px; border-radius: 50%; background: var(--surface-alt); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; text-decoration: none; color: var(--ink); font-size: 16px;
    transition: background 0.2s ease;
  }
  #back-link:active { background: var(--border); }
  h1 { font-size: 18px; font-weight: 600; margin: 0; }
  #logout-btn {
    background: none; border: 1px solid var(--border); border-radius: 8px; color: var(--ink-muted);
    font-size: 12px; padding: 6px 10px; cursor: pointer; transition: background 0.2s ease;
  }
  #logout-btn:active { background: var(--surface-alt); }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 2px rgba(20, 24, 28, 0.03); animation: rise 0.5s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) {
    .card { animation: none !important; }
  }
  .profile-head { display: flex; justify-content: space-between; align-items: flex-start; }
  .avatar-ring {
    width: 52px; height: 52px; border-radius: 50%; padding: 3px; margin-bottom: 10px;
    background: conic-gradient(from 180deg, var(--accent), var(--lime), var(--accent));
  }
  .avatar {
    width: 100%; height: 100%; border-radius: 50%; background: var(--surface); display: flex; align-items: center;
    justify-content: center; font-weight: 600; font-size: 15px; color: var(--accent);
  }
  .name { font-size: 15px; font-weight: 600; margin: 0; }
  .role { font-size: 12px; color: var(--ink-muted); margin: 2px 0 0; }
  .member-since { font-size: 11px; color: var(--ink-muted); margin: 2px 0 0; }
  .bio { font-size: 13px; color: var(--ink-muted); margin: 8px 0 0; line-height: 1.5; }
  .bio.empty { font-style: italic; }

  #edit-profile-btn {
    flex-shrink: 0; background: none; border: 1px solid var(--border); border-radius: 8px;
    color: var(--ink-muted); font-size: 11px; font-weight: 600; padding: 6px 10px; cursor: pointer;
    transition: background 0.2s ease;
  }
  #edit-profile-btn:active { background: var(--surface-alt); }

  .edit-form label { display: block; font-size: 11px; font-weight: 600; color: var(--ink-muted); margin: 12px 0 4px; }
  .edit-form label:first-child { margin-top: 0; }
  .edit-form input, .edit-form textarea {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 13px; font-family: inherit; background: var(--bg); color: var(--ink); resize: vertical;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .edit-form input:focus, .edit-form textarea:focus {
    outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(30, 111, 235, 0.15);
  }
  .edit-form textarea { min-height: 70px; }
  .edit-actions { display: flex; gap: 8px; margin-top: 14px; }
  .edit-actions button {
    flex: 1; padding: 9px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    transition: transform 0.12s ease, opacity 0.2s ease;
  }
  .edit-actions button:active:not(:disabled) { transform: scale(0.98); }
  #save-profile-btn { border: none; background: var(--accent); color: var(--accent-ink); }
  #save-profile-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  #cancel-profile-btn { border: 1px solid var(--border); background: var(--surface); color: var(--ink); }
  .edit-error { font-size: 12px; color: var(--danger); margin: 8px 0 0; }

  .spinner {
    width: 13px; height: 13px; border: 2px solid rgba(255, 255, 255, 0.4); border-top-color: #fff;
    border-radius: 50%; animation: spin 0.7s linear infinite; flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
  .stat-tile {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px; text-align: center;
    animation: rise 0.5s ease both; animation-delay: 0.08s;
  }
  .stat-value { font-size: 20px; font-weight: 700; margin: 0; color: var(--accent); }
  .stat-label { font-size: 11px; color: var(--ink-muted); margin: 2px 0 0; }

  h2 { font-size: 14px; font-weight: 600; margin: 16px 0 10px; }
  h2:first-of-type { margin-top: 0; }
  .list-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 4px 14px; margin-bottom: 4px; }
  .list-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); gap: 10px; }
  .list-row:last-child { border-bottom: none; }
  .list-row .name { font-size: 13px; font-weight: 500; }
  .list-row .sub { font-size: 11px; color: var(--ink-muted); }
  .list-row a.mini-btn, .list-row button.mini-btn {
    flex-shrink: 0; font-size: 11px; font-weight: 600; padding: 6px 10px; border-radius: 6px;
    background: var(--accent); color: var(--accent-ink); text-decoration: none; border: none; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; transition: transform 0.12s ease, opacity 0.2s ease;
  }
  .list-row a.mini-btn:active, .list-row button.mini-btn:active:not(:disabled) { transform: scale(0.96); }
  .list-row button.mini-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .fav-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .fav-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
    text-decoration: none; color: inherit; display: block; transition: transform 0.15s ease;
  }
  .fav-card:active { transform: scale(0.98); }
  .fav-cover { aspect-ratio: 1; background: var(--surface-alt); display: flex; align-items: center; justify-content: center; color: var(--ink-muted); font-size: 20px; background-size: cover; background-position: center; }
  .fav-info { padding: 8px; }
  .fav-title { font-size: 12px; font-weight: 500; margin: 0 0 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fav-artist { font-size: 11px; color: var(--ink-muted); margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  a.link-row {
    display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: var(--ink);
    text-decoration: none; padding: 10px 0; border-bottom: 1px solid var(--border);
  }
  a.link-row:last-child { border-bottom: none; }
  a.link-row span.arrow { color: var(--accent); }

  #become-artist-btn {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    width: 100%; padding: 10px; border: none; border-radius: 8px; background: var(--accent);
    color: var(--accent-ink); font-size: 13px; font-weight: 600; cursor: pointer;
    transition: transform 0.12s ease;
  }
  #become-artist-btn:active:not(:disabled) { transform: scale(0.98); }
  #become-artist-btn:disabled { opacity: 0.6; cursor: not-allowed; }

  .gate-msg, .empty-state { text-align: center; color: var(--ink-muted); font-size: 14px; padding: 30px 0; }
  .gate-msg { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .gate-msg { animation: none; }
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="bg-blobs" aria-hidden="true">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>

<div class="wrap">
  <div class="eq" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
  <div class="header-row">
    <div class="header-left">
      <a href="browse.html" id="back-link" aria-label="Back to Browse">←</a>
      <h1>My Account</h1>
    </div>
    <button type="button" id="logout-btn" class="hidden">Log out</button>
  </div>

  <div id="gate" class="gate-msg">Checking access…</div>

  <div id="content" class="hidden">
    <div class="card">
      <div id="profile-view">
        <div class="profile-head">
          <div class="avatar-ring"><div class="avatar" id="avatar-initials">?</div></div>
          <button type="button" id="edit-profile-btn">Edit Profile</button>
        </div>
        <p class="name" id="display-name">—</p>
        <p class="role" id="role-label">—</p>
        <p class="member-since hidden" id="member-since"></p>
        <p class="bio empty" id="bio-display">No bio yet.</p>
      </div>

      <div id="profile-edit" class="edit-form hidden">
        <label for="edit-display-name">Display name</label>
        <input type="text" id="edit-display-name" maxlength="60" />

        <label for="edit-bio" id="edit-bio-label" class="hidden">Bio</label>
        <textarea id="edit-bio" maxlength="280" class="hidden" placeholder="Tell listeners a bit about yourself…"></textarea>

        <p class="edit-error hidden" id="edit-error"></p>
        <div class="edit-actions">
          <button type="button" id="cancel-profile-btn">Cancel</button>
          <button type="button" id="save-profile-btn"><span>Save</span></button>
        </div>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-tile"><p class="stat-value" id="stat-downloads">–</p><p class="stat-label">Downloads</p></div>
      <div class="stat-tile"><p class="stat-value" id="stat-purchases">–</p><p class="stat-label">Beats bought</p></div>
    </div>

    <div class="card hidden" id="artist-links">
      <a href="my-uploads.html" class="link-row">My Uploads <span class="arrow">→</span></a>
      <a href="balance.html" class="link-row">My Balance &amp; Withdrawals <span class="arrow">→</span></a>
    </div>

    <div class="card hidden" id="become-artist-card">
      <p style="font-size:13px;color:var(--ink-muted);margin:0 0 10px;">Want to sell your own tracks or beats?</p>
      <button type="button" id="become-artist-btn"><span>Become an Artist</span></button>
    </div>

    <h2>My Downloads</h2>
    <div id="downloads-list"><p class="empty-state">No downloads yet.</p></div>

    <h2>My Purchases</h2>
    <div id="purchases-list"><p class="empty-state">No purchases yet.</p></div>

    <h2>Favorites</h2>
    <div id="fav-grid" class="fav-grid"><p class="empty-state">No favorites yet.</p></div>
  </div>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  const SUPABASE_URL = 'https://tradvpjpxshngjemnoaq.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRyYWR2cGpweHNobmdqZW1ub2FxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NDQ5NTksImV4cCI6MjEwNDUyMDk1OX0.6guQxGOLId1MqlFa79i4lS2-l63FDthS7svRmWySQ94';

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const gate = document.getElementById('gate');
  const content = document.getElementById('content');

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
  }

  // Toggles a primary button between its normal label and a spinner + label,
  // and disables it while a request is in flight.
  function setButtonLoading(btn, loading, loadingLabel) {
    const label = btn.querySelector('span');
    if (loading) {
      btn.dataset.originalLabel = label.textContent;
      label.textContent = loadingLabel;
      btn.insertAdjacentHTML('afterbegin', '<span class="spinner"></span>');
      btn.disabled = true;
    } else {
      const spinner = btn.querySelector('.spinner');
      if (spinner) spinner.remove();
      if (btn.dataset.originalLabel) label.textContent = btn.dataset.originalLabel;
      btn.disabled = false;
    }
  }

  (async () => {
    const { data: { user } } = await supabase.auth.getUser();
    if (!user) {
      gate.innerHTML = 'Please <a href="login.html">log in</a> first.';
      return;
    }
    gate.classList.add('hidden');
    content.classList.remove('hidden');
    document.getElementById('logout-btn').classList.remove('hidden');

    let profile = (await supabase.from('profiles').select('*').eq('id', user.id).maybeSingle()).data;
    renderProfileView(profile);
    setupProfileEditing(user.id, () => profile, (updated) => { profile = updated; });

    if (profile?.role === 'artist') {
      document.getElementById('artist-links').classList.remove('hidden');
    } else {
      const becomeCard = document.getElementById('become-artist-card');
      becomeCard.classList.remove('hidden');
      document.getElementById('become-artist-btn').addEventListener('click', async (e) => {
        setButtonLoading(e.currentTarget, true, 'Updating…');
        const { error } = await supabase.from('profiles').update({ role: 'artist' }).eq('id', user.id);
        if (!error) {
          window.location.reload();
        } else {
          setButtonLoading(e.currentTarget, false);
        }
      });
    }

    const [{ count: downloadsCount }, { count: purchasesCount }] = await Promise.all([
      supabase.from('downloads').select('*', { count: 'exact', head: true }).eq('user_id', user.id),
      supabase.from('purchases').select('*', { count: 'exact', head: true }).eq('buyer_id', user.id).eq('status', 'fulfilled'),
    ]);
    document.getElementById('stat-downloads').textContent = downloadsCount || 0;
    document.getElementById('stat-purchases').textContent = purchasesCount || 0;

    await loadDownloads(user.id);
    await loadPurchases(user.id);
    await loadFavorites(user.id);
  })();

  function renderProfileView(profile) {
    const displayName = profile?.display_name || 'Unnamed';
    document.getElementById('display-name').textContent = displayName;
    document.getElementById('role-label').textContent = profile?.role === 'artist' ? 'Artist' : 'Listener';
    document.getElementById('avatar-initials').textContent = displayName.slice(0, 2).toUpperCase();

    const memberSinceEl = document.getElementById('member-since');
    if (profile?.created_at) {
      const joined = new Date(profile.created_at).toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
      memberSinceEl.textContent = `Member since ${joined}`;
      memberSinceEl.classList.remove('hidden');
    } else {
      memberSinceEl.classList.add('hidden');
    }

    const bioEl = document.getElementById('bio-display');
    if (profile?.role === 'artist') {
      bioEl.classList.remove('hidden');
      if (profile?.bio) {
        bioEl.textContent = profile.bio;
        bioEl.classList.remove('empty');
      } else {
        bioEl.textContent = 'No bio yet.';
        bioEl.classList.add('empty');
      }
    } else {
      // Bio is only shown on the public artist profile page, so listeners don't need it here.
      bioEl.classList.add('hidden');
    }
  }

  function setupProfileEditing(userId, getProfile, setProfile) {
    const viewEl = document.getElementById('profile-view');
    const editEl = document.getElementById('profile-edit');
    const nameInput = document.getElementById('edit-display-name');
    const bioLabel = document.getElementById('edit-bio-label');
    const bioInput = document.getElementById('edit-bio');
    const errorEl = document.getElementById('edit-error');
    const saveBtn = document.getElementById('save-profile-btn');

    document.getElementById('edit-profile-btn').addEventListener('click', () => {
      const profile = getProfile();
      nameInput.value = profile?.display_name || '';
      errorEl.classList.add('hidden');

      const isArtist = profile?.role === 'artist';
      bioLabel.classList.toggle('hidden', !isArtist);
      bioInput.classList.toggle('hidden', !isArtist);
      bioInput.value = isArtist ? (profile?.bio || '') : '';

      viewEl.classList.add('hidden');
      editEl.classList.remove('hidden');
      nameInput.focus();
    });

    document.getElementById('cancel-profile-btn').addEventListener('click', () => {
      editEl.classList.add('hidden');
      viewEl.classList.remove('hidden');
    });

    saveBtn.addEventListener('click', async () => {
      const newName = nameInput.value.trim();
      if (!newName) {
        errorEl.textContent = 'Display name can\'t be empty.';
        errorEl.classList.remove('hidden');
        return;
      }

      const profile = getProfile();
      const isArtist = profile?.role === 'artist';
      const updates = { display_name: newName };
      if (isArtist) updates.bio = bioInput.value.trim() || null;

      setButtonLoading(saveBtn, true, 'Saving…');
      const { error } = await supabase.from('profiles').update(updates).eq('id', userId);
      setButtonLoading(saveBtn, false);

      if (error) {
        errorEl.textContent = 'Something went wrong — try again.';
        errorEl.classList.remove('hidden');
        return;
      }

      const updatedProfile = { ...profile, ...updates };
      setProfile(updatedProfile);
      renderProfileView(updatedProfile);
      editEl.classList.add('hidden');
      viewEl.classList.remove('hidden');
    });
  }

  async function loadDownloads(userId) {
    const { data: downloads } = await supabase.from('downloads').select('*').eq('user_id', userId).order('downloaded_at', { ascending: false });
    const container = document.getElementById('downloads-list');
    if (!downloads || downloads.length === 0) {
      container.innerHTML = '<p class="empty-state">No downloads yet.</p>';
      return;
    }

    const trackIds = [...new Set(downloads.map(d => d.track_id))];
    const { data: tracks } = trackIds.length ? await supabase.from('tracks').select('id, title, file_path').in('id', trackIds) : { data: [] };
    const trackMap = new Map((tracks || []).map(t => [t.id, t]));

    container.innerHTML = '<div class="list-card"></div>';
    const listCard = container.querySelector('.list-card');
    for (const d of downloads) {
      const track = trackMap.get(d.track_id);
      if (!track) continue;
      const ext = (track.file_path.split('.').pop() || 'mp3').toLowerCase();
      const safeTitle = (track.title || 'track').replace(/[\\/:*?"<>|]/g, '').trim();
      const publicUrl = supabase.storage.from('public-previews').getPublicUrl(track.file_path, { download: `${safeTitle}.${ext}` }).data.publicUrl;
      const row = document.createElement('div');
      row.className = 'list-row';
      row.innerHTML = `
        <div><p class="name">${escapeHtml(track.title)}</p><p class="sub">${new Date(d.downloaded_at).toLocaleDateString()}</p></div>
        <a class="mini-btn" href="${publicUrl}" download>Download</a>
      `;
      listCard.appendChild(row);
    }
    if (listCard.children.length === 0) container.innerHTML = '<p class="empty-state">No downloads yet.</p>';
  }

  async function loadPurchases(userId) {
    const { data: purchases } = await supabase.from('purchases').select('*').eq('buyer_id', userId).eq('status', 'fulfilled').order('fulfilled_at', { ascending: false });
    const container = document.getElementById('purchases-list');
    if (!purchases || purchases.length === 0) {
      container.innerHTML = '<p class="empty-state">No purchases yet.</p>';
      return;
    }

    const trackIds = purchases.filter(p => p.item_type === 'track').map(p => p.item_id);
    const beatIds = purchases.filter(p => p.item_type === 'beat').map(p => p.item_id);
    const [{ data: trackItems }, { data: beatItems }] = await Promise.all([
      trackIds.length ? supabase.from('tracks').select('id, title, file_path').in('id', trackIds) : { data: [] },
      beatIds.length ? supabase.from('beats').select('id, title, full_path').in('id', beatIds) : { data: [] },
    ]);
    const itemMap = new Map();
    (trackItems || []).forEach(t => itemMap.set(`track-${t.id}`, { title: t.title, path: t.file_path }));
    (beatItems || []).forEach(b => itemMap.set(`beat-${b.id}`, { title: b.title, path: b.full_path }));

    container.innerHTML = '<div class="list-card"></div>';
    const listCard = container.querySelector('.list-card');
    for (const purchase of purchases) {
      const item = itemMap.get(`${purchase.item_type}-${purchase.item_id}`);
      if (!item) continue;
      const row = document.createElement('div');
      row.className = 'list-row';
      row.innerHTML = `
        <div><p class="name">${escapeHtml(item.title)}</p><p class="sub">K${purchase.amount}</p></div>
        <button type="button" class="mini-btn" data-path="${escapeHtml(item.path)}">Get link</button>
      `;
      row.querySelector('.mini-btn').addEventListener('click', async (e) => {
        e.target.disabled = true;
        e.target.textContent = 'Loading…';
        const ext = (item.path.split('.').pop() || 'mp3').toLowerCase();
        const safeTitle = (item.title || 'track').replace(/[\\/:*?"<>|]/g, '').trim();
        const { data: signedData, error } = await supabase.storage.from('private-full').createSignedUrl(item.path, 3600, { download: `${safeTitle}.${ext}` });
        if (error) {
          e.target.textContent = 'Failed';
          return;
        }
        window.open(signedData.signedUrl, '_blank');
        e.target.textContent = 'Get link';
        e.target.disabled = false;
      });
      listCard.appendChild(row);
    }
    if (listCard.children.length === 0) container.innerHTML = '<p class="empty-state">No purchases yet.</p>';
  }

  async function loadFavorites(userId) {
    const { data: favs } = await supabase.from('favorites').select('*').eq('user_id', userId).order('created_at', { ascending: false });
    const favGrid = document.getElementById('fav-grid');
    if (!favs || favs.length === 0) {
      favGrid.innerHTML = '<p class="empty-state">No favorites yet.</p>';
      return;
    }

    const trackIds = favs.filter(f => f.item_type === 'track').map(f => f.item_id);
    const beatIds = favs.filter(f => f.item_type === 'beat').map(f => f.item_id);

    const [{ data: trackItems }, { data: beatItems }] = await Promise.all([
      trackIds.length ? supabase.from('tracks').select('*').in('id', trackIds) : { data: [] },
      beatIds.length ? supabase.from('beats').select('*').in('id', beatIds) : { data: [] },
    ]);

    const ownerIds = [...new Set([...(trackItems || []), ...(beatItems || [])].map(i => i.owner_id))];
    const { data: profiles } = ownerIds.length ? await supabase.from('profiles').select('id, display_name').in('id', ownerIds) : { data: [] };
    const nameMap = new Map((profiles || []).map(p => [p.id, p.display_name || 'Unknown artist']));

    const itemMap = new Map();
    (trackItems || []).forEach(t => itemMap.set(`track-${t.id}`, { ...t, itemType: 'track' }));
    (beatItems || []).forEach(b => itemMap.set(`beat-${b.id}`, { ...b, itemType: 'beat' }));

    favGrid.innerHTML = '';
    for (const fav of favs) {
      const item = itemMap.get(`${fav.item_type}-${fav.item_id}`);
      if (!item) continue; // item may have been removed/deleted since favoriting
      const card = document.createElement('a');
      card.className = 'fav-card';
      card.href = `detail.html?type=${item.itemType}&id=${item.id}`;
      card.innerHTML = `
        <div class="fav-cover" style="${item.cover_url ? `background-image:url(${item.cover_url})` : ''}">${item.cover_url ? '' : (item.itemType === 'beat' ? '♫' : '♪')}</div>
        <div class="fav-info">
          <p class="fav-title">${escapeHtml(item.title)}</p>
          <p class="fav-artist">${escapeHtml(nameMap.get(item.owner_id) || '')}</p>
        </div>
      `;
      favGrid.appendChild(card);
    }
    if (favGrid.children.length === 0) {
      favGrid.innerHTML = '<p class="empty-state">No favorites yet.</p>';
    }
  }

  document.getElementById('logout-btn').addEventListener('click', async () => {
    await supabase.auth.signOut();
    window.location.href = 'login.html';
  });
</script>
