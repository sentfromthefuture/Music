<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Artist — ZAMI</title>
<style>
  :root {
    --bg: #f6f7f5;
    --surface: #ffffff;
    --surface-alt: #eef0ed;
    --border: #dfe2de;
    --ink: #14181c;
    --ink-muted: #5b6560;
    --accent: #1e6feb;
    --accent-ink: #ffffff;
    --success: #2f8f5b;
    --stat-green: #34b871;
    --danger: #b3261e;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 20px 16px 60px; }
  .header-row { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  #back-link {
    width: 32px; height: 32px; border-radius: 50%; background: var(--surface-alt); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; text-decoration: none; color: var(--ink); font-size: 16px;
  }
  h1 { font-size: 16px; font-weight: 600; margin: 0; }

  .profile-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 16px; text-align: center; margin-bottom: 20px; }
  .profile-avatar {
    width: 76px; height: 76px; border-radius: 50%; background: var(--surface-alt); color: var(--accent);
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 26px;
    margin: 0 auto 12px;
  }
  .profile-name { font-size: 18px; font-weight: 700; margin: 0 0 4px; }
  .profile-bio { font-size: 13px; color: var(--ink-muted); margin: 0 0 16px; line-height: 1.5; }
  .profile-bio.empty { font-style: italic; }

  .stat-row { display: flex; justify-content: center; gap: 22px; margin-bottom: 16px; }
  .stat { display: flex; flex-direction: column; align-items: center; }
  .stat-value { font-size: 15px; font-weight: 700; }
  .stat-label { font-size: 10px; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.03em; margin-top: 2px; }

  #follow-btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 9px 24px; border-radius: 20px;
    font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid var(--accent);
    background: var(--accent); color: var(--accent-ink);
  }
  #follow-btn.following { background: var(--surface); color: var(--ink); border-color: var(--border); }
  #follow-btn:disabled { opacity: 0.6; cursor: not-allowed; }

  .section-title { font-size: 15px; font-weight: 700; margin: 0 0 12px; }

  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .item-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; text-decoration: none; color: inherit; display: block; position: relative; }
  .item-cover {
    aspect-ratio: 1; background: var(--surface-alt); display: flex; align-items: center; justify-content: center;
    color: var(--ink-muted); font-size: 26px; background-size: cover; background-position: center;
  }
  .heart-btn {
    position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border-radius: 50%;
    background: rgba(255,255,255,0.85); border: none; display: flex; align-items: center; justify-content: center;
    font-size: 15px; cursor: pointer; color: var(--ink-muted);
  }
  .heart-btn.favorited { color: var(--danger); }
  .item-info { padding: 8px; }
  .item-title { font-size: 13px; font-weight: 500; margin: 0 0 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-price { font-size: 11px; font-weight: 700; color: var(--stat-green); margin: 0; }

  .empty-state, .loading-state { text-align: center; color: var(--ink-muted); font-size: 14px; padding: 40px 0; grid-column: 1 / -1; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header-row">
    <a href="browse.html" id="back-link">←</a>
    <h1>Artist</h1>
  </div>

  <div class="profile-card" id="profile-card">
    <p class="loading-state">Loading…</p>
  </div>

  <p class="section-title">Tracks &amp; Beats</p>
  <div class="grid" id="grid">
    <p class="loading-state">Loading…</p>
  </div>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  const SUPABASE_URL = 'https://tradvpjpxshngjemnoaq.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRyYWR2cGpweHNobmdqZW1ub2FxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NDQ5NTksImV4cCI6MjEwNDUyMDk1OX0.6guQxGOLId1MqlFa79i4lS2-l63FDthS7svRmWySQ94';

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const profileCard = document.getElementById('profile-card');
  const grid = document.getElementById('grid');

  const artistId = new URLSearchParams(window.location.search).get('id');

  let currentUserId = null;
  let favoriteKeys = new Set();
  let isFollowing = false;

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
  }

  function renderMissingArtist() {
    profileCard.innerHTML = '<p class="empty-state">Artist not found.</p>';
    grid.innerHTML = '';
  }

  async function toggleFollow(btn) {
    if (!currentUserId) {
      if (confirm('Log in to follow artists. Go to login now?')) window.location.href = 'login.html';
      return;
    }
    btn.disabled = true;
    if (isFollowing) {
      const { error } = await supabase.from('follows').delete().eq('follower_id', currentUserId).eq('artist_id', artistId);
      if (!error) {
        isFollowing = false;
        btn.classList.remove('following');
        btn.textContent = '+ Follow';
        updateFollowerCount(-1);
      }
    } else {
      const { error } = await supabase.from('follows').insert({ follower_id: currentUserId, artist_id: artistId });
      if (!error) {
        isFollowing = true;
        btn.classList.add('following');
        btn.textContent = '✓ Following';
        updateFollowerCount(1);
      }
    }
    btn.disabled = false;
  }

  function updateFollowerCount(delta) {
    const el = document.getElementById('follower-count-value');
    if (!el) return;
    el.textContent = Math.max(0, (parseInt(el.textContent, 10) || 0) + delta);
  }

  async function toggleFavorite(itemType, itemId, btn) {
    if (!currentUserId) {
      if (confirm('Log in to save favorites. Go to login now?')) window.location.href = 'login.html';
      return;
    }
    const key = `${itemType}-${itemId}`;
    btn.disabled = true;
    if (favoriteKeys.has(key)) {
      const { error } = await supabase.from('favorites').delete().eq('user_id', currentUserId).eq('item_id', itemId).eq('item_type', itemType);
      if (!error) {
        favoriteKeys.delete(key);
        btn.classList.remove('favorited');
        btn.textContent = '♡';
      }
    } else {
      const { error } = await supabase.from('favorites').insert({ user_id: currentUserId, item_id: itemId, item_type: itemType });
      if (!error) {
        favoriteKeys.add(key);
        btn.classList.add('favorited');
        btn.textContent = '♥';
      }
    }
    btn.disabled = false;
  }

  function renderGrid(items) {
    grid.innerHTML = '';
    if (items.length === 0) {
      grid.innerHTML = '<p class="empty-state">Nothing here yet.</p>';
      return;
    }
    for (const item of items) {
      const key = `${item.item_type}-${item.id}`;
      const isFavorited = favoriteKeys.has(key);
      const priceLabel = item.item_type === 'track' && item.is_free ? 'Free' : `K${item.price}`;

      const card = document.createElement('a');
      card.className = 'item-card';
      card.href = `detail.html?type=${item.item_type}&id=${item.id}`;
      card.innerHTML = `
        <div class="item-cover" style="${item.cover_url ? `background-image:url(${item.cover_url})` : ''}">${item.cover_url ? '' : (item.item_type === 'beat' ? '♫' : '♪')}</div>
        <button type="button" class="heart-btn ${isFavorited ? 'favorited' : ''}" data-key="${key}">${isFavorited ? '♥' : '♡'}</button>
        <div class="item-info">
          <p class="item-title">${escapeHtml(item.title)}</p>
          <p class="item-price">${priceLabel}</p>
        </div>
      `;
      card.querySelector('.heart-btn').addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        toggleFavorite(item.item_type, item.id, e.currentTarget);
      });
      grid.appendChild(card);
    }
  }

  (async () => {
    if (!artistId) { renderMissingArtist(); return; }

    const { data: { user } } = await supabase.auth.getUser();
    if (user) {
      currentUserId = user.id;
      const [{ data: favs }, { data: followRow }] = await Promise.all([
        supabase.from('favorites').select('item_id, item_type').eq('user_id', user.id),
        supabase.from('follows').select('artist_id').eq('follower_id', user.id).eq('artist_id', artistId).maybeSingle(),
      ]);
      (favs || []).forEach(f => favoriteKeys.add(`${f.item_type}-${f.item_id}`));
      isFollowing = !!followRow;
    }

    const [{ data: profile }, { data: items }, { data: followCountRow }] = await Promise.all([
      supabase.from('profiles').select('id, display_name, bio').eq('id', artistId).maybeSingle(),
      supabase.from('browse_feed').select('*').eq('owner_id', artistId).order('created_at', { ascending: false }),
      supabase.from('artist_follow_counts').select('follower_count').eq('artist_id', artistId).maybeSingle(),
    ]);

    if (!profile) { renderMissingArtist(); return; }

    const rows = items || [];
    const totals = rows.reduce((acc, r) => {
      acc.plays += r.play_count || 0;
      acc.downloads += r.download_count || 0;
      acc.purchases += r.purchase_count || 0;
      return acc;
    }, { plays: 0, downloads: 0, purchases: 0 });
    const followerCount = followCountRow?.follower_count || 0;
    const name = profile.display_name || 'Unknown artist';

    profileCard.innerHTML = `
      <div class="profile-avatar">${escapeHtml(name.slice(0, 2).toUpperCase())}</div>
      <p class="profile-name">${escapeHtml(name)}</p>
      <p class="profile-bio ${profile.bio ? '' : 'empty'}">${profile.bio ? escapeHtml(profile.bio) : 'No bio yet.'}</p>
      <div class="stat-row">
        <div class="stat"><span class="stat-value">${rows.length}</span><span class="stat-label">Tracks</span></div>
        <div class="stat"><span class="stat-value">${totals.plays}</span><span class="stat-label">Plays</span></div>
        <div class="stat"><span class="stat-value">${totals.downloads}</span><span class="stat-label">Downloads</span></div>
        <div class="stat"><span class="stat-value" id="follower-count-value">${followerCount}</span><span class="stat-label">Followers</span></div>
      </div>
      <button type="button" id="follow-btn" class="${isFollowing ? 'following' : ''}">${isFollowing ? '✓ Following' : '+ Follow'}</button>
    `;
    document.getElementById('follow-btn').addEventListener('click', (e) => toggleFollow(e.currentTarget));

    renderGrid(rows);
  })();
</script>
</body>
</html>
