<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Browse — ZAMI</title>
<style>
  :root {
    --bg: #f6f7f5;
    --surface: #ffffff;
    --surface-alt: #eef0ed;
    --border: #dfe2de;
    --ink: #14181c;
    --ink-muted: #5b6560;
    --accent: #1e6feb;
    --accent-ink: #ffffff;
    --success: #2f8f5b;
    --danger: #b3261e;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 20px 16px 60px; }
  .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0; }
  .sub { font-size: 13px; color: var(--ink-muted); margin: 0 0 16px; }
  #account-link {
    width: 32px; height: 32px; border-radius: 50%; background: var(--surface-alt);
    display: flex; align-items: center; justify-content: center; text-decoration: none; color: var(--ink-muted); font-size: 14px;
  }

  .chips { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 16px; padding-bottom: 2px; }
  .chip {
    flex-shrink: 0; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 500;
    background: var(--surface-alt); border: 1px solid var(--border); color: var(--ink-muted); cursor: pointer; white-space: nowrap;
  }
  .chip.active { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 22px; }
  .item-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; text-decoration: none; color: inherit; display: block; position: relative; }
  .item-cover {
    aspect-ratio: 1; background: var(--surface-alt); display: flex; align-items: center; justify-content: center;
    color: var(--ink-muted); font-size: 26px; background-size: cover; background-position: center;
  }
  .heart-btn {
    position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border-radius: 50%;
    background: rgba(255,255,255,0.85); border: none; display: flex; align-items: center; justify-content: center;
    font-size: 15px; cursor: pointer; color: var(--ink-muted);
  }
  .heart-btn.favorited { color: var(--danger); }
  .item-info { padding: 8px; }
  .item-title { font-size: 13px; font-weight: 500; margin: 0 0 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-artist { font-size: 11px; color: var(--ink-muted); margin: 0 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-price { font-size: 11px; font-weight: 600; }
  .item-price.free { color: var(--success); }

  .empty-state, .loading-state { text-align: center; color: var(--ink-muted); font-size: 14px; padding: 40px 0; grid-column: 1 / -1; }

  /* --- Top Downloads / Trending: header row with "See all" ---
     These now sit right under the genre chips as featured discovery
     sections, so the gap above each one is compact (chips already
     carry their own bottom margin) rather than the larger gap you'd
     want after a full catalogue block. */
  .rank-section-head { display: flex; align-items: baseline; justify-content: space-between; margin: 18px 0 10px; }
  .rank-section-head--first { margin-top: 4px; }
  .section-title { display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 700; margin: 0; }
  .see-all {
    flex-shrink: 0; font-size: 12px; font-weight: 600; color: var(--accent);
    background: none; border: none; padding: 0; cursor: pointer; font-family: inherit;
  }
  .see-all:disabled { opacity: 0.4; cursor: default; }

  /*
   * Horizontally scrolling rank rail.
   * The number of visible cards is NEVER set directly — it falls out of
   * (container width) / (card width), so it adapts on its own per device.
   */
  .rank-scroll {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    scroll-snap-type: x proximity;
    padding: 2px 2px 10px;
    margin: 0 -2px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none; /* Firefox: hide the scrollbar, scrolling still works */
  }
  .rank-scroll::-webkit-scrollbar { display: none; } /* Chrome/Safari: hide the scrollbar */
  .rank-scroll .empty-state, .rank-scroll .loading-state { flex: 1 0 100%; padding: 20px 0; }

  /*
   * Card width is a CLAMP, not a column count:
   *   clamp(min, preferred-vw, max)
   * - never smaller than the min (stays legible on a 320px phone)
   * - never larger than the max (stays "compact", per the design spec)
   * - in between, it scales with viewport width, so a wider screen fits
   *   more cards automatically instead of stretching existing ones.
   * flex-shrink:0 stops cards from being squeezed to fit a fixed row.
   */
  .rank-card {
    flex: 0 0 clamp(126px, 32vw, 156px);
    flex-shrink: 0;
    scroll-snap-align: start;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
  }
  .rank-card-thumb {
    position: relative;
    aspect-ratio: 1;
    background: var(--surface-alt);
    background-size: cover;
    background-position: center;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-muted); font-size: 22px;
  }
  .rank-card-badge {
    position: absolute; top: 6px; left: 6px;
    min-width: 20px; height: 20px; padding: 0 5px;
    border-radius: 10px; background: rgba(20,24,28,0.72); color: #fff;
    font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center;
  }
  .rank-card-menu {
    position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 50%;
    background: rgba(255,255,255,0.88); border: none; display: flex; align-items: center; justify-content: center;
    font-size: 13px; line-height: 1; color: var(--ink-muted); cursor: pointer; padding: 0;
  }
  .rank-card-info { padding: 8px; min-width: 0; }
  .rank-card-title { font-size: 12.5px; font-weight: 600; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rank-card-artist { font-size: 11px; color: var(--ink-muted); margin: 1px 0 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rank-card-stat { font-size: 11px; font-weight: 700; color: var(--accent); margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header-row">
    <h1>Browse</h1>
    <a href="account.html" id="account-link">👤</a>
  </div>
  <p class="sub">Tracks and beats from local artists.</p>

  <input type="text" id="search-input" placeholder="Search tracks, beats, artists…" style="width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:var(--surface);color:var(--ink);font-family:inherit;margin-bottom:12px;" />

  <div class="chips" id="genre-chips">
    <button type="button" class="chip active" data-genre="all">All</button>
  </div>

  <div class="rank-section-head rank-section-head--first">
    <p class="section-title">🔥 Top Downloads</p>
    <button type="button" class="see-all" data-target="top-downloads-list">See all →</button>
  </div>
  <div class="rank-scroll" id="top-downloads-list"><p class="empty-state">Nothing yet.</p></div>

  <div class="rank-section-head">
    <p class="section-title">📈 Trending this week</p>
    <button type="button" class="see-all" data-target="trending-list">See all →</button>
  </div>
  <div class="rank-scroll" id="trending-list"><p class="empty-state">Nothing trending yet.</p></div>

  <div class="grid" id="grid">
    <p class="loading-state">Loading…</p>
  </div>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  const SUPABASE_URL = 'https://tradvpjpxshngjemnoaq.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRyYWR2cGpweHNobmdqZW1ub2FxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NDQ5NTksImV4cCI6MjEwNDUyMDk1OX0.6guQxGOLId1MqlFa79i4lS2-l63FDthS7svRmWySQ94';

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const grid = document.getElementById('grid');
  const genreChips = document.getElementById('genre-chips');

  let allItems = [];
  let favoriteKeys = new Set();
  let currentUserId = null;
  let activeGenre = 'all';
  let searchTerm = '';
  let nameMap = new Map();

  const searchInput = document.getElementById('search-input');
  searchInput.addEventListener('input', () => {
    searchTerm = searchInput.value.trim().toLowerCase();
    renderGrid();
  });

  // "See all →" scrolls its rail to the end, revealing whatever didn't fit
  // on screen. No separate route exists for these lists yet, so this keeps
  // the affordance honest without inventing a new page.
  document.querySelectorAll('.see-all').forEach(btn => {
    btn.addEventListener('click', () => {
      const target = document.getElementById(btn.dataset.target);
      if (target) target.scrollTo({ left: target.scrollWidth, behavior: 'smooth' });
    });
  });

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
  }

  (async () => {
    const { data: { user } } = await supabase.auth.getUser();
    if (user) {
      currentUserId = user.id;
      const { data: favs } = await supabase.from('favorites').select('item_id, item_type').eq('user_id', user.id);
      (favs || []).forEach(f => favoriteKeys.add(`${f.item_type}-${f.item_id}`));
    }

    const [{ data: tracks }, { data: beats }] = await Promise.all([
      supabase.from('tracks').select('*').eq('status', 'approved'),
      supabase.from('beats').select('*').eq('status', 'approved'),
    ]);

    // Fetch artist display names in one batch
    const ownerIds = [...new Set([...(tracks || []), ...(beats || [])].map(i => i.owner_id))];
    const { data: profiles } = ownerIds.length ? await supabase.from('profiles').select('id, display_name').in('id', ownerIds) : { data: [] };
    nameMap = new Map((profiles || []).map(p => [p.id, p.display_name || 'Unknown artist']));

    allItems = [
      ...(tracks || []).map(t => ({ ...t, itemType: 'track', artistName: nameMap.get(t.owner_id) })),
      ...(beats || []).map(b => ({ ...b, itemType: 'beat', artistName: nameMap.get(b.owner_id) })),
    ].sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

    buildGenreChips();
    renderGrid();
    renderTopDownloads();
    loadTrending();
    subscribeRealtime();
  })();

  // --- Top Downloads: derived straight from allItems, so it updates
  // automatically whenever the realtime subscription refreshes counts ---
  function renderTopDownloads() {
    const container = document.getElementById('top-downloads-list');
    const top = allItems
      .filter(i => i.itemType === 'track' && i.is_free)
      .sort((a, b) => (b.download_count || 0) - (a.download_count || 0))
      .slice(0, 20);
    if (top.length === 0) {
      container.innerHTML = '<p class="empty-state" style="padding:10px 0;">Nothing yet.</p>';
      return;
    }
    container.innerHTML = '';
    top.forEach((item, i) => {
      container.appendChild(rankRow(item, i + 1, `${item.download_count || 0} downloads`));
    });
  }

  function rankRow(item, rank, statLabel) {
    const row = document.createElement('a');
    row.className = 'rank-card';
    row.href = `detail.html?type=${item.itemType}&id=${item.id}`;
    row.innerHTML = `
      <div class="rank-card-thumb" style="${item.cover_url ? `background-image:url(${item.cover_url})` : ''}">
        ${item.cover_url ? '' : (item.itemType === 'beat' ? '♫' : '♪')}
        <span class="rank-card-badge">${rank}</span>
        <button type="button" class="rank-card-menu" aria-label="More options">⋮</button>
      </div>
      <div class="rank-card-info">
        <p class="rank-card-title">${escapeHtml(item.title)}</p>
        <p class="rank-card-artist">${escapeHtml(item.artistName || '')}</p>
        <p class="rank-card-stat">${statLabel}</p>
      </div>
    `;
    // Overflow menu is a stub for now — stopPropagation so it never triggers
    // the card's navigation link. Wire up a real menu here later if needed.
    row.querySelector('.rank-card-menu').addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
    });
    return row;
  }

  // --- Trending this week: recent downloads + recent fulfilled purchases,
  // last 7 days. Computed once at load (not itself realtime-subscribed —
  // a further enhancement if you want it ticking live too) ---
  async function loadTrending() {
    const since = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString();

    const [{ data: recentDownloads }, { data: recentPurchases }] = await Promise.all([
      supabase.from('downloads').select('track_id').gte('downloaded_at', since),
      supabase.from('purchases').select('item_id, item_type').eq('status', 'fulfilled').gte('fulfilled_at', since),
    ]);

    const scores = new Map(); // key: `${type}-${id}` -> count
    (recentDownloads || []).forEach(d => {
      const key = `track-${d.track_id}`;
      scores.set(key, (scores.get(key) || 0) + 1);
    });
    (recentPurchases || []).forEach(p => {
      const key = `${p.item_type}-${p.item_id}`;
      scores.set(key, (scores.get(key) || 0) + 1);
    });

    const ranked = [...scores.entries()]
      .map(([key, count]) => {
        const [type, id] = [key.slice(0, key.indexOf('-')), key.slice(key.indexOf('-') + 1)];
        const item = allItems.find(i => i.itemType === type && i.id === id);
        return item ? { item, count } : null;
      })
      .filter(Boolean)
      .sort((a, b) => b.count - a.count)
      .slice(0, 5);

    const container = document.getElementById('trending-list');
    if (ranked.length === 0) {
      container.innerHTML = '<p class="empty-state" style="padding:10px 0;">Nothing trending yet.</p>';
      return;
    }
    container.innerHTML = '';
    ranked.forEach(({ item, count }, i) => {
      container.appendChild(rankRow(item, i + 1, `${count} this week`));
    });
  }

  // --- Realtime: new approved uploads and count changes appear live.
  // (Removals don't propagate to anonymous visitors — see note above;
  // RLS blocks the event once a row is no longer 'approved'.)
  function subscribeRealtime() {
    supabase.channel('browse-tracks')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'tracks' }, (payload) => handleRealtimeChange('track', payload))
      .subscribe();
    supabase.channel('browse-beats')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'beats' }, (payload) => handleRealtimeChange('beat', payload))
      .subscribe();
  }

  async function handleRealtimeChange(itemType, payload) {
    if (payload.eventType === 'DELETE') {
      const oldId = payload.old?.id;
      allItems = allItems.filter(i => !(i.itemType === itemType && i.id === oldId));
      renderGrid();
      renderTopDownloads();
      return;
    }

    const row = payload.new;
    if (!row || row.status !== 'approved') return; // only approved rows reach us anyway, under RLS

    const idx = allItems.findIndex(i => i.itemType === itemType && i.id === row.id);
    if (idx === -1) {
      // Brand new approved item — fetch its artist name if we don't have it cached
      if (!nameMap.has(row.owner_id)) {
        const { data: profile } = await supabase.from('profiles').select('display_name').eq('id', row.owner_id).maybeSingle();
        nameMap.set(row.owner_id, profile?.display_name || 'Unknown artist');
      }
      allItems = [{ ...row, itemType, artistName: nameMap.get(row.owner_id) }, ...allItems];
      if (row.genre && !document.querySelector(`.chip[data-genre="${CSS.escape(row.genre)}"]`)) {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'chip';
        chip.dataset.genre = row.genre;
        chip.textContent = row.genre;
        genreChips.appendChild(chip);
      }
    } else {
      allItems[idx] = { ...allItems[idx], ...row };
    }
    renderGrid();
    renderTopDownloads();
  }

  function buildGenreChips() {
    const genres = [...new Set(allItems.map(i => i.genre).filter(Boolean))];
    for (const genre of genres) {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip';
      chip.dataset.genre = genre;
      chip.textContent = genre;
      genreChips.appendChild(chip);
    }
    genreChips.addEventListener('click', (e) => {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      activeGenre = chip.dataset.genre;
      renderGrid();
    });
  }

  function renderGrid() {
    let items = activeGenre === 'all' ? allItems : allItems.filter(i => i.genre === activeGenre);
    if (searchTerm) {
      items = items.filter(i =>
        i.title.toLowerCase().includes(searchTerm) ||
        (i.artistName || '').toLowerCase().includes(searchTerm) ||
        (i.genre || '').toLowerCase().includes(searchTerm)
      );
    }
    grid.innerHTML = '';
    if (items.length === 0) {
      grid.innerHTML = `<p class="empty-state">${searchTerm ? 'No results found.' : 'Nothing here yet.'}</p>`;
      return;
    }
    for (const item of items) {
      const key = `${item.itemType}-${item.id}`;
      const isFavorited = favoriteKeys.has(key);
      const priceLabel = item.itemType === 'track' && item.is_free ? 'Free' : `K${item.price}`;
      const priceClass = item.itemType === 'track' && item.is_free ? 'free' : '';
      const countLabel = item.itemType === 'track' && item.is_free
        ? `${item.download_count || 0} downloads`
        : `${item.play_count || 0} plays · ${item.purchase_count || 0} buys`;

      const card = document.createElement('a');
      card.className = 'item-card';
      card.href = `detail.html?type=${item.itemType}&id=${item.id}`;
      card.innerHTML = `
        <div class="item-cover" style="${item.cover_url ? `background-image:url(${item.cover_url})` : ''}">${item.cover_url ? '' : (item.itemType === 'beat' ? '♫' : '♪')}</div>
        <button type="button" class="heart-btn ${isFavorited ? 'favorited' : ''}" data-key="${key}" data-type="${item.itemType}" data-id="${item.id}">${isFavorited ? '♥' : '♡'}</button>
        <div class="item-info">
          <p class="item-title">${escapeHtml(item.title)}</p>
          <p class="item-artist">${escapeHtml(item.artistName)}</p>
          <p class="item-price ${priceClass}">${priceLabel}</p>
          <p style="font-size:10px;color:var(--ink-muted);margin:2px 0 0;">${countLabel}</p>
        </div>
      `;
      card.querySelector('.heart-btn').addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        toggleFavorite(item.itemType, item.id, e.currentTarget);
      });
      grid.appendChild(card);
    }
  }

  async function toggleFavorite(itemType, itemId, btn) {
    if (!currentUserId) {
      if (confirm('Log in to save favorites. Go to login now?')) window.location.href = 'login.html';
      return;
    }
    const key = `${itemType}-${itemId}`;
    btn.disabled = true;
    if (favoriteKeys.has(key)) {
      const { error } = await supabase.from('favorites').delete().eq('user_id', currentUserId).eq('item_id', itemId).eq('item_type', itemType);
      if (!error) {
        favoriteKeys.delete(key);
        btn.classList.remove('favorited');
        btn.textContent = '♡';
      }
    } else {
      const { error } = await supabase.from('favorites').insert({ user_id: currentUserId, item_id: itemId, item_type: itemType });
      if (!error) {
        favoriteKeys.add(key);
        btn.classList.add('favorited');
        btn.textContent = '♥';
      }
    }
    btn.disabled = false;
  }
</script>
</body>
</html>
