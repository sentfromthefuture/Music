<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Details — Music Platform</title>
<style>
  :root {
    --bg: #f6f7f5;
    --surface: #ffffff;
    --surface-alt: #eef0ed;
    --border: #dfe2de;
    --ink: #14181c;
    --ink-muted: #5b6560;
    --accent: #1e6feb;
    --accent-ink: #ffffff;
    --lime: #65a30d;
    --lime-ink: #ffffff;
    --danger: #b3261e;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    position: relative;
    overflow-x: hidden;
  }

  /* --- Animated background --- */
  .bg-blobs { position: fixed; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; }
  .blob { position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.24; }
  .blob-1 { width: 280px; height: 280px; background: var(--accent); top: -90px; left: -70px; animation: float1 16s ease-in-out infinite; }
  .blob-2 { width: 240px; height: 240px; background: var(--lime); bottom: -80px; right: -60px; animation: float2 20s ease-in-out infinite; }
  @keyframes float1 { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(30px, 40px) scale(1.12); } }
  @keyframes float2 { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(-30px, -24px) scale(1.14); } }
  @media (prefers-reduced-motion: reduce) {
    .blob { animation: none !important; }
  }

  .wrap { position: relative; z-index: 1; max-width: 420px; margin: 0 auto; padding: 20px 16px 60px; }

  .header-row { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  a.back {
    width: 32px; height: 32px; border-radius: 50%; background: var(--surface-alt); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; text-decoration: none; color: var(--ink); font-size: 16px;
    transition: background 0.2s ease;
  }
  a.back:active { background: var(--border); }
  .eq { display: flex; align-items: flex-end; gap: 4px; height: 18px; }
  .eq span { width: 4px; border-radius: 2px; transform-origin: bottom; animation: eq 1.1s ease-in-out infinite; }
  .eq span:nth-child(1) { height: 40%; background: var(--accent); animation-delay: 0s; }
  .eq span:nth-child(2) { height: 75%; background: var(--lime); animation-delay: 0.15s; }
  .eq span:nth-child(3) { height: 100%; background: var(--accent); animation-delay: 0.3s; }
  .eq span:nth-child(4) { height: 60%; background: var(--lime); animation-delay: 0.45s; }
  @keyframes eq { 0%, 100% { transform: scaleY(0.35); } 50% { transform: scaleY(1); } }
  @media (prefers-reduced-motion: reduce) {
    .eq span { animation: none; transform: scaleY(0.7); }
  }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px;
    box-shadow: 0 1px 2px rgba(20, 24, 28, 0.03); animation: rise 0.5s ease both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) {
    .card { animation: none !important; }
  }

  .cover-frame {
    padding: 4px; border-radius: calc(var(--radius) + 4px); margin-bottom: 14px;
    background: conic-gradient(from 180deg, var(--accent), var(--lime), var(--accent));
  }
  .cover {
    aspect-ratio: 1; border-radius: var(--radius); background: var(--surface-alt);
    display: flex; align-items: center; justify-content: center; color: var(--ink-muted); font-size: 40px;
    background-size: cover; background-position: center; position: relative; overflow: hidden;
  }
  .heart-btn {
    position: absolute; top: 10px; right: 10px; width: 34px; height: 34px; border-radius: 50%;
    background: rgba(255,255,255,0.9); border: none; display: flex; align-items: center; justify-content: center;
    font-size: 17px; cursor: pointer; color: var(--ink-muted); transition: transform 0.15s ease;
  }
  .heart-btn:active { transform: scale(0.9); }
  .heart-btn.favorited { color: var(--danger); animation: pop 0.3s ease; }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.3); } 100% { transform: scale(1); } }

  .title { font-size: 18px; font-weight: 600; margin: 0 0 2px; }
  .meta { font-size: 13px; color: var(--ink-muted); margin: 0 0 16px; }
  #count-display { display: flex; align-items: center; gap: 6px; }
  #count-display:not(:empty)::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--lime); flex-shrink: 0; }

  audio { width: 100%; margin-bottom: 16px; }

  #player { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  #waveform { flex: 1; }
  .play-btn {
    flex-shrink: 0; width: 40px; height: 40px; border-radius: 50%; border: none;
    background: var(--accent); color: var(--accent-ink); font-size: 15px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 0 3px rgba(30, 111, 235, 0.15); transition: transform 0.12s ease;
  }
  .play-btn:active { transform: scale(0.94); }

  .price { font-size: 22px; font-weight: 700; margin: 0 0 14px; display: inline-flex; align-items: center; gap: 8px; }
  .price.free { color: var(--lime); }

  a.action-btn, button.action-btn {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    width: 100%; padding: 12px; border: none; border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), #3a7ff0); color: var(--accent-ink);
    font-size: 14px; font-weight: 600; text-decoration: none; cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.2s ease;
    box-shadow: 0 4px 14px rgba(30, 111, 235, 0.25);
  }
  a.action-btn:active, button.action-btn:active { transform: scale(0.98); }
  .action-row { display: flex; gap: 10px; }
  .action-row .action-btn { width: auto; flex: 1.6; }
  .action-row .share-btn {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 12px;
    border: 1px solid rgba(30, 111, 235, 0.25); border-radius: 8px; background: rgba(30, 111, 235, 0.06);
    color: var(--accent); font-size: 14px; font-weight: 600; cursor: pointer; transition: transform 0.12s ease;
  }
  .action-row .share-btn:active { transform: scale(0.98); }
  .price.free ~ .action-row a.action-btn, .price.free ~ .action-row button.action-btn {
    background: linear-gradient(135deg, var(--lime), #7cbf1f); box-shadow: 0 4px 14px rgba(101, 163, 13, 0.25);
  }

  .gate-msg, .empty-state { text-align: center; color: var(--ink-muted); font-size: 14px; padding: 40px 0; }
  .gate-msg { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .gate-msg { animation: none; }
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="bg-blobs" aria-hidden="true">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
</div>

<div class="wrap">
  <div class="header-row">
    <a href="browse.html" class="back" aria-label="Back to Browse">←</a>
    <div class="eq" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
  </div>

  <div id="loading" class="gate-msg">Loading…</div>

  <div id="content" class="hidden card">
    <div class="cover-frame">
      <div class="cover" id="cover">
        <button type="button" class="heart-btn" id="heart-btn">♡</button>
        <span id="cover-icon"></span>
      </div>
    </div>
    <p class="title" id="item-title">—</p>
    <p class="meta" id="item-meta">—</p>
    <p class="meta" id="count-display" style="margin-top:-10px;"></p>

    <div id="player" class="hidden">
      <div id="waveform"></div>
      <button type="button" id="play-btn" class="play-btn">▶</button>
    </div>

    <p class="price" id="price-display">—</p>
    <div class="action-row">
      <a href="#" id="action-btn" class="action-btn">—</a>
      <button type="button" id="share-btn" class="share-btn" aria-label="Share">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/><line x1="15.4" y1="6.5" x2="8.6" y2="10.5"/></svg>
        Share
      </button>
    </div>
  </div>
</div>

<script src="zami-share.js"></script>
<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
  import WaveSurfer from 'https://esm.sh/wavesurfer.js@7';

  const SUPABASE_URL = 'https://tradvpjpxshngjemnoaq.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRyYWR2cGpweHNobmdqZW1ub2FxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NDQ5NTksImV4cCI6MjEwNDUyMDk1OX0.6guQxGOLId1MqlFa79i4lS2-l63FDthS7svRmWySQ94';

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Public https address where detail.html is hosted — used for the link in shared posters.
  ZamiShare.config.baseUrl = 'https://sentfromthefuture.github.io/Music/';

  const params = new URLSearchParams(window.location.search);
  const itemType = params.get('type');
  const itemId = params.get('id');

  const loading = document.getElementById('loading');
  const content = document.getElementById('content');

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
  }

  (async () => {
    if (!itemType || !itemId || !['track', 'beat'].includes(itemType)) {
      loading.textContent = 'Invalid or missing item.';
      return;
    }

    const table = itemType === 'beat' ? 'beats' : 'tracks';
    const { data: item, error } = await supabase.from(table).select('*').eq('id', itemId).eq('status', 'approved').maybeSingle();
    if (error || !item) {
      loading.textContent = 'This item is not available.';
      return;
    }

    const { data: profile } = await supabase.from('profiles').select('display_name').eq('id', item.owner_id).maybeSingle();
    const artistName = profile?.display_name || 'Unknown artist';

    loading.classList.add('hidden');
    content.classList.remove('hidden');

    document.getElementById('item-title').textContent = item.title;
    document.getElementById('item-meta').textContent = `${artistName} · ${item.genre || ''}${itemType === 'beat' ? ' · Beat' : ''}`;

    const coverEl = document.getElementById('cover');
    if (item.cover_url) {
      coverEl.style.backgroundImage = `url(${item.cover_url})`;
    } else {
      document.getElementById('cover-icon').textContent = itemType === 'beat' ? '♫' : '♪';
    }

    // Social proof counts
    const countLabel = itemType === 'track' && item.is_free
      ? `${item.download_count || 0} downloads`
      : `${item.play_count || 0} plays · ${item.purchase_count || 0} buys`;
    document.getElementById('count-display').textContent = countLabel;

    // Share: builds the promo poster on tap (zami-share.js)
    const shareSong = ZamiShare.songFromItem(item, { type: itemType, artistName });
    document.getElementById('share-btn').addEventListener('click', () => ZamiShare.open(shareSong));

    const isFreeTrack = itemType === 'track' && item.is_free;
    const priceDisplay = document.getElementById('price-display');
    const actionBtn = document.getElementById('action-btn');

    let playCounted = false;
    function loadPlayer(url) {
      const wavesurfer = WaveSurfer.create({
        container: '#waveform',
        waveColor: '#c9cdc7',
        progressColor: '#1e6feb',
        height: 56,
        barWidth: 2,
        barGap: 1,
        cursorWidth: 0,
        url,
      });
      const playBtn = document.getElementById('play-btn');
      wavesurfer.on('play', () => {
        playBtn.textContent = '⏸';
        if (!playCounted) {
          playCounted = true;
          supabase.rpc('increment_play_count', { p_item_type: itemType, p_item_id: item.id }).then(() => {});
        }
      });
      wavesurfer.on('pause', () => { playBtn.textContent = '▶'; });
      wavesurfer.on('finish', () => { playBtn.textContent = '▶'; });
      playBtn.addEventListener('click', () => wavesurfer.playPause());
      document.getElementById('player').classList.remove('hidden');
    }

    // Builds a safe "Track Title.mp3" style filename from the item title + the
    // real storage path's extension, for use with Supabase's `download` option
    // (sets Content-Disposition so the browser saves with this name instead of
    // the raw storage path/UUID).
    function downloadFilename(title, storagePath) {
      const ext = (storagePath.split('.').pop() || 'mp3').toLowerCase();
      const safeTitle = (title || 'track').replace(/[\\/:*?"<>|]/g, '').trim();
      return `${safeTitle}.${ext}`;
    }

    if (isFreeTrack) {
      const filename = downloadFilename(item.title, item.file_path);
      const publicUrl = supabase.storage.from('public-previews').getPublicUrl(item.file_path, { download: filename }).data.publicUrl;
      const playerUrl = supabase.storage.from('public-previews').getPublicUrl(item.file_path).data.publicUrl;
      loadPlayer(playerUrl);
      priceDisplay.textContent = 'Free';
      priceDisplay.classList.add('free');
      actionBtn.textContent = 'Download';
      actionBtn.href = publicUrl;
      actionBtn.addEventListener('click', async () => {
        const { data: { user } } = await supabase.auth.getUser();
        supabase.from('downloads').insert({ user_id: user ? user.id : null, track_id: item.id }).then(() => {});
        supabase.rpc('increment_download_count', { p_track_id: item.id }).then(() => {});
      });
    } else if (item.preview_path) {
      // Paid track or beat with a preview clip
      const publicUrl = supabase.storage.from('public-previews').getPublicUrl(item.preview_path).data.publicUrl;
      loadPlayer(publicUrl);
      priceDisplay.textContent = `K${item.price}`;
      actionBtn.textContent = 'Buy';
      actionBtn.href = `checkout.html?type=${itemType}&id=${item.id}`;
    } else {
      // Paid item with no preview available
      priceDisplay.textContent = `K${item.price}`;
      actionBtn.textContent = 'Buy';
      actionBtn.href = `checkout.html?type=${itemType}&id=${item.id}`;
    }

    // Favorites
    const heartBtn = document.getElementById('heart-btn');
    const { data: { user } } = await supabase.auth.getUser();
    let isFavorited = false;
    if (user) {
      const { data: fav } = await supabase.from('favorites').select('id').eq('user_id', user.id).eq('item_id', item.id).eq('item_type', itemType).maybeSingle();
      isFavorited = !!fav;
      heartBtn.textContent = isFavorited ? '♥' : '♡';
      heartBtn.classList.toggle('favorited', isFavorited);
    }
    heartBtn.addEventListener('click', async () => {
      if (!user) {
        if (confirm('Log in to save favorites. Go to login now?')) window.location.href = 'login.html';
        return;
      }
      heartBtn.disabled = true;
      if (isFavorited) {
        const { error } = await supabase.from('favorites').delete().eq('user_id', user.id).eq('item_id', item.id).eq('item_type', itemType);
        if (!error) { isFavorited = false; heartBtn.textContent = '♡'; heartBtn.classList.remove('favorited'); }
      } else {
        const { error } = await supabase.from('favorites').insert({ user_id: user.id, item_id: item.id, item_type: itemType });
        if (!error) { isFavorited = true; heartBtn.textContent = '♥'; heartBtn.classList.add('favorited'); }
      }
      heartBtn.disabled = false;
    });
  })();
</script>
</body>
</html>
